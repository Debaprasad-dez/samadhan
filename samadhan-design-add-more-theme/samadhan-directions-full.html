<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Samadhan — Four directions, full IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Tiro+Devanagari+Sanskrit&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">

<style>
/* ============ EXPLORER CHROME ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:#07080B;color:#E6EAF0;-webkit-font-smoothing:antialiased;
     font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;padding:36px 22px 70px}
.wrap{max-width:1460px;margin:0 auto}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:26px;flex-wrap:wrap;margin-bottom:26px}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:#78829A}
h1.pg{font-size:30px;font-weight:600;letter-spacing:-.03em;color:#fff;margin-top:9px}
.hd p{font-size:13.5px;color:#8E99AD;max-width:520px;line-height:1.6;margin-top:9px}

/* --- theme bar: always on top, opaque --- */
.themebar{background:#101319;border:1px solid #1D222C;border-radius:13px;padding:12px;margin-bottom:18px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;isolation:isolate}
.themebar .tl{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:#69748B;padding-left:4px;flex:0 0 auto}
.tsw{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.tbtn{background:#161B23;border:1px solid #242B36;border-radius:10px;padding:9px 12px;
      cursor:pointer;font:inherit;color:#D6DCE6;text-align:left;transition:background .16s,border-color .16s;min-width:136px}
.tbtn:hover{background:#1D242E;border-color:#323B49}
.tbtn[aria-pressed="true"]{background:#232C39;border-color:#5C6A80}
.tbtn .cs{display:flex;gap:3px;margin-bottom:7px}
.tbtn .cs i{width:13px;height:13px;border-radius:3px;display:block}
.tbtn .nm{font-size:12.5px;font-weight:600}
.tbtn .sb{font-size:10.5px;color:#828EA5;margin-top:2px}

/* --- two columns, never collapses, never overlaps --- */
.layout{display:grid;grid-template-columns:minmax(184px,214px) minmax(0,1fr);gap:20px;align-items:start;isolation:isolate}
.rail{background:#101319;border:1px solid #1D222C;border-radius:13px;padding:11px 10px;
  max-height:calc(100vh - 60px);overflow-y:auto;position:relative;z-index:1}
.rl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#69748B;padding:11px 7px 5px}
.rail button{display:flex;width:100%;align-items:center;gap:8px;background:transparent;border:0;color:#AFBACD;font:inherit;font-size:12px;
  padding:7px 8px;border-radius:7px;cursor:pointer;text-align:left;line-height:1.3}
.rail button:hover{background:#1B212B;color:#fff}
.rail button[aria-current="true"]{background:#28303C;color:#fff;font-weight:600}
.rail button .rn{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9px;color:#69748B;flex:0 0 auto}

.stagewrap{min-width:0;background:#0C0E13;border:1px solid #1A1F28;border-radius:13px;padding:20px;position:relative;z-index:0}
.pgmeta{margin-bottom:4px;padding-bottom:16px;border-bottom:1px solid #1A1F28}
.pgmeta .rt{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#7C87A0}
.pgmeta h2{font-size:21px;font-weight:600;letter-spacing:-.025em;color:#fff;margin-top:5px}
.pgmeta p{font-size:13px;color:#8E99AD;line-height:1.6;margin-top:7px}
.pgmeta p b{color:#D9E0EB;font-weight:600}

/* --- info tabs --- */
.itabs{display:flex;gap:5px;margin:16px 0 0}
.itab{background:#141920;border:1px solid #222932;color:#93A0B5;font:inherit;font-size:11.5px;font-weight:600;
  padding:7px 13px;border-radius:8px;cursor:pointer}
.itab[aria-selected="true"]{background:#2A3341;border-color:#3D4959;color:#fff}

.deck{display:flex;justify-content:center;padding:20px 0 4px;overflow-x:auto}
.phone{width:392px;height:800px;border-radius:44px;padding:10px;background:#1B1F27;flex:0 0 auto;
  box-shadow:0 34px 80px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.08)}
.laptop{width:100%;max-width:1120px;border-radius:13px;overflow:hidden;box-shadow:0 40px 90px -34px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.08)}
.lchrome{height:34px;background:#14171D;display:flex;align-items:center;gap:6px;padding:0 13px}
.lchrome i{width:9px;height:9px;border-radius:50%;background:#2B313B;display:block}
.lchrome .u{margin-left:11px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#767F92;background:rgba(255,255,255,.05);padding:3px 10px;border-radius:5px}

/* ============ THEME TOKEN CONTRACT ============ */
.app{background:var(--bg);color:var(--ink);height:100%;display:flex;flex-direction:column;overflow:hidden;
     font-family:var(--f-ui);border-radius:inherit}
.phone .app{border-radius:35px;height:100%}

[data-theme="dawn"]{
  --bg:#FBF6EC;--surface:#FFFFFF;--surface-2:#F6EFE2;--ink:#2A211A;--muted:#7A6A5C;--faint:#A69684;
  --line:#EADFCC;--line-2:#DCCDB2;--track:#EFE6D5;
  --brand:#B4541A;--brand-soft:#FBEDE1;--brand-line:#EFCFB4;--gold:#A9862F;
  --ok:#2C6A45;--ok-bg:#EAF3ED;--ok-line:#BBD9C6;
  --warn:#A8690A;--warn-bg:#FBF1DE;--warn-line:#E9CE9C;
  --dang:#A32E22;--dang-bg:#FBEDEB;--dang-line:#E8C0B8;
  --info:#2C5578;--info-bg:#EAF1F7;--info-line:#BDD3E4;
  --r:14px;--r-lg:20px;--r-sm:9px;
  --sh:0 1px 2px rgba(42,33,26,.05),0 6px 18px -8px rgba(42,33,26,.13);
  --f-ui:'Inter',sans-serif;--f-dis:'Fraunces',serif;--dis-w:500;--dis-ls:-.012em;
}
[data-theme="mughal"]{
  --bg:#0D1226;--surface:#141B33;--surface-2:#1B2340;--ink:#E7EAF5;--muted:#98A2C0;--faint:#6E799B;
  --line:#232C4B;--line-2:#313C63;--track:#1E2542;
  --brand:#C9A24A;--brand-soft:#241F17;--brand-line:#463A22;--gold:#C9A24A;
  --ok:#4BC08D;--ok-bg:#122B23;--ok-line:#22503E;
  --warn:#E0AE4E;--warn-bg:#2A2115;--warn-line:#544022;
  --dang:#F0736A;--dang-bg:#2C1817;--dang-line:#55282A;
  --info:#6FA8E8;--info-bg:#14213A;--info-line:#274063;
  --r:14px;--r-lg:20px;--r-sm:9px;
  --sh:0 1px 2px rgba(0,0,0,.4),0 8px 26px -10px rgba(0,0,0,.6);
  --f-ui:'Inter',sans-serif;--f-dis:'Fraunces',serif;--dis-w:400;--dis-ls:-.008em;
}
[data-theme="steel"]{
  --bg:#F5F6F8;--surface:#FFFFFF;--surface-2:#F9FAFB;--ink:#0D1117;--muted:#5D6675;--faint:#929BAA;
  --line:#E4E7EC;--line-2:#D2D7DF;--track:#EDEFF3;
  --brand:#1F5FD0;--brand-soft:#EDF3FE;--brand-line:#C3D8F9;--gold:#8A6A1F;
  --ok:#046C4E;--ok-bg:#ECFDF5;--ok-line:#A6EACB;
  --warn:#B45309;--warn-bg:#FFFAEB;--warn-line:#FCDF9B;
  --dang:#B42318;--dang-bg:#FEF3F2;--dang-line:#FDCDC7;
  --info:#175CD3;--info-bg:#EFF6FF;--info-line:#BFDBFE;
  --r:8px;--r-lg:11px;--r-sm:6px;
  --sh:0 1px 2px rgba(13,17,23,.06),0 4px 12px -6px rgba(13,17,23,.10);
  --f-ui:'Inter',sans-serif;--f-dis:'Inter',sans-serif;--dis-w:600;--dis-ls:-.032em;
}
[data-theme="nilgiri"]{
  --bg:#EFF2F0;--surface:#FBFCFC;--surface-2:#E7EDEA;--ink:#16211E;--muted:#5F706B;--faint:#93A29D;
  --line:#DCE4E1;--line-2:#C6D2CE;--track:#E3EAE7;
  --brand:#136F63;--brand-soft:#E5F1EE;--brand-line:#B3D6CE;--gold:#7C7233;
  --ok:#1A6B4A;--ok-bg:#E8F3ED;--ok-line:#B4D8C6;
  --warn:#93701A;--warn-bg:#F5F0DF;--warn-line:#DBCD98;
  --dang:#9B3A32;--dang-bg:#F6EAE8;--dang-line:#DDBAB5;
  --info:#2A5F80;--info-bg:#E8F0F5;--info-line:#B6CEDE;
  --r:16px;--r-lg:24px;--r-sm:10px;
  --sh:0 1px 2px rgba(22,33,30,.05),0 10px 26px -12px rgba(22,33,30,.16);
  --f-ui:'Inter',sans-serif;--f-dis:'Fraunces',serif;--dis-w:400;--dis-ls:-.01em;
}

/* ============ APP COMPONENTS ============ */
.app *{font-variant-numeric:tabular-nums}
.dis{font-family:var(--f-dis);font-weight:var(--dis-w);letter-spacing:var(--dis-ls)}
.mono{font-family:'JetBrains Mono',monospace}

/* shells */
.hdr{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);padding:0 16px}
.hdr .sb{height:38px;display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:600}
.hdr .tr{display:flex;justify-content:space-between;align-items:center;padding:2px 0 12px;gap:12px}
.hdr .tt{font-size:17px}
.hdr .st{font-size:11px;color:var(--muted);margin-top:2px}
.hdr .ic{width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto;position:relative}
.hdr .ic svg{width:16px;height:16px;color:var(--muted)}
.hdr .ic b{position:absolute;top:-4px;right:-4px;background:var(--dang);color:#fff;font-size:9px;width:15px;height:15px;border-radius:50%;display:grid;place-items:center;font-weight:700}
.body{flex:1;overflow:hidden;padding:13px 16px}
.tabbar{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 0 22px;align-items:end}
.tb{text-align:center;color:var(--faint)}
.tb svg{width:20px;height:20px}
.tb b{display:block;font-size:9px;font-weight:600;margin-top:2px}
.tb.on{color:var(--brand)}
.tb.fab{position:relative}
.tb.fab .btn{width:46px;height:46px;border-radius:15px;background:var(--brand);color:var(--surface);display:grid;place-items:center;margin:-14px auto 0;box-shadow:var(--sh)}
.tb.fab .btn svg{width:22px;height:22px}

.staff{display:grid;grid-template-columns:206px 1fr;height:660px;overflow:hidden}
.sside{background:var(--surface);border-right:1px solid var(--line);padding:14px 11px;overflow:hidden}
.sside .bd{padding:2px 8px 13px;border-bottom:1px solid var(--line);margin-bottom:10px}
.sside .bd .b1{font-size:15px}
.sside .bd .b2{font-size:10.5px;color:var(--muted);margin-top:2px}
.snl{font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:11px 8px 5px}
.sside a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r-sm);font-size:12.5px;color:var(--muted);text-decoration:none;font-weight:500}
.sside a svg{width:15px;height:15px}
.sside a.on{background:var(--brand-soft);color:var(--brand);font-weight:600;border:1px solid var(--brand-line)}
.sside a .c{margin-left:auto;font-size:10.5px;font-weight:600}
.smain{padding:18px 20px;overflow:hidden}
.smain>.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:15px;flex-wrap:wrap}
.smain h2{font-size:20px}
.smain .sub{font-size:12.5px;color:var(--muted);margin-top:4px}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:11px}
.card.flat{box-shadow:none}
.ch{padding:10px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.ch b{font-size:12.5px;font-weight:600}
.ch .m{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--faint);letter-spacing:.06em}
.cb{padding:13px}
.k{font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.v{font-size:29px;letter-spacing:-.035em;line-height:1.03;margin-top:5px;font-weight:600}
.v small{font-size:15px;color:var(--muted);font-weight:500;letter-spacing:0}
.dd{font-size:11px;color:var(--muted);margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:var(--r-sm);border:1px solid;white-space:nowrap}
.pill svg{width:10px;height:10px}
.pill.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.pill.wn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.pill.dg{color:var(--dang);background:var(--dang-bg);border-color:var(--dang-line)}
.pill.if{color:var(--info);background:var(--info-bg);border-color:var(--info-line)}
.pill.nu{color:var(--muted);background:var(--track);border-color:var(--line-2)}
.pill.br{color:var(--brand);background:var(--brand-soft);border-color:var(--brand-line)}

.trk{position:relative;height:6px;border-radius:4px;background:var(--track)}
.trk i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;display:block}
.trk u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.7;border-radius:1px}
.tcap{display:flex;justify-content:space-between;margin-top:5px;font-size:10px;color:var(--muted)}
.tcap b{color:var(--ink);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:600;padding:10px 14px;border-radius:var(--r-sm);border:1px solid transparent}
.btn.p{background:var(--brand);color:var(--surface)}
.btn.s{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn.g{background:var(--track);color:var(--ink)}
.btn.w{width:100%}
.btn svg{width:15px;height:15px}

.row{display:flex;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line);align-items:flex-start}
.row:last-child{border-bottom:0}
.row .mn{flex:1;min-width:0}
.row .t1{font-size:12.5px;font-weight:600;letter-spacing:-.005em}
.row .t2{font-size:10.5px;color:var(--muted);margin-top:3px}
.row .rt{flex:0 0 auto;text-align:right}
.av{width:30px;height:30px;border-radius:var(--r-sm);background:var(--brand-soft);border:1px solid var(--brand-line);color:var(--brand);
    display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 auto}
.av svg{width:17px;height:17px}

table{width:100%;border-collapse:collapse}
th{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:left;
   padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--line-2);white-space:nowrap}
th.r{text-align:right}
td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:middle}
td.r{text-align:right}
tr:last-child td{border-bottom:0}
.t1s{font-weight:600;font-size:12px}
.t2s{font-size:10.5px;color:var(--muted);margin-top:2px}
.idm{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);margin-top:2px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:500;padding:5px 10px;border-radius:var(--r-sm);border:1px solid var(--line-2);color:var(--muted);background:var(--surface)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}

/* journey tracker — the signature */
.jrn{position:relative;padding-left:30px}
.jrn::before{content:"";position:absolute;left:9px;top:8px;bottom:20px;width:2px;background:var(--line-2)}
.jrn .fill{position:absolute;left:9px;top:8px;width:2px;background:var(--ok)}
.jn{position:relative;padding-bottom:15px}
.jn .d{position:absolute;left:-30px;top:0;width:20px;height:20px;border-radius:50%;background:var(--surface);
       border:2px solid var(--line-2);display:grid;place-items:center}
.jn .d svg{width:10px;height:10px}
.jn.done .d{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.jn.live .d{background:var(--warn);border-color:var(--warn);color:var(--surface);box-shadow:0 0 0 5px var(--warn-bg)}
.jn.next .d{border-style:dashed;border-color:var(--dang);color:var(--dang)}
.jn .w{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--faint)}
.jn .w em{font-style:normal;background:var(--track);color:var(--ink);padding:1px 5px;border-radius:4px;margin-left:6px}
.jn .h{font-size:12.5px;font-weight:600;margin-top:3px}
.jn .p{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.45}
.jn.pend{opacity:.5}
.who{margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 9px;display:flex;align-items:center;gap:9px}

.hero{position:relative;border-radius:var(--r-lg);overflow:hidden;margin-bottom:12px;border:1px solid var(--line)}
.hero svg{display:block;width:100%;height:auto}
.hero .ov{position:absolute;left:0;right:0;bottom:0;padding:14px}
.hero .ov .ht{font-size:19px;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.5)}
.hero .ov .hs{font-size:11.5px;color:rgba(255,255,255,.85);margin-top:3px}

.wave{display:flex;align-items:center;gap:3px;height:30px}
.wave i{width:3px;border-radius:2px;background:var(--brand);display:block}
.orb{width:64px;height:64px;border-radius:50%;background:var(--brand);display:grid;place-items:center;margin:0 auto;
     box-shadow:0 0 0 9px var(--brand-soft),0 0 0 18px var(--track)}
.orb svg{width:26px;height:26px;color:var(--surface)}

.badge{aspect-ratio:1;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;text-align:center;padding:8px}
.badge svg{width:20px;height:20px;color:var(--gold)}
.badge b{display:block;font-size:9px;font-weight:600;margin-top:5px;line-height:1.25}
.badge.off{opacity:.34}

.stepper{display:flex;align-items:center;gap:0;margin-bottom:14px}
.stepper .s{flex:1;text-align:center;position:relative}
.stepper .s i{width:22px;height:22px;border-radius:50%;background:var(--track);color:var(--muted);display:grid;place-items:center;
   margin:0 auto;font-size:10.5px;font-weight:700;font-style:normal;border:1px solid var(--line-2)}
.stepper .s.done i{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.stepper .s.on i{background:var(--brand);color:var(--surface);border-color:var(--brand)}
.stepper .s b{display:block;font-size:9.5px;font-weight:600;margin-top:5px;color:var(--muted)}
.stepper .s.on b{color:var(--ink)}
.stepper .s::after{content:"";position:absolute;top:11px;left:50%;width:100%;height:1.5px;background:var(--line-2);z-index:-1}
.stepper .s:last-child::after{display:none}
.stepper{position:relative;z-index:1}

.inp{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:11px 12px;font-size:12.5px;color:var(--ink)}
.inp.ph{color:var(--faint)}
.aihint{background:var(--info-bg);border:1px solid var(--info-line);border-radius:var(--r-sm);padding:9px 11px;font-size:11px;color:var(--info);line-height:1.5;margin-top:9px}
.aihint b{font-weight:700}

.heat{display:grid;gap:3px}
.heat i{aspect-ratio:1;border-radius:2px;display:block}
.legend{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:10px;color:var(--muted)}
.legend .sc{display:flex;gap:2px}
.legend .sc i{width:16px;height:9px;border-radius:2px;display:block}

.spark{display:block;width:100%;height:38px}
.bars{display:flex;align-items:flex-end;gap:4px;height:74px}
.bars i{flex:1;border-radius:3px 3px 0 0;display:block;background:var(--brand);min-height:2px}
.blab{display:flex;gap:4px;margin-top:5px}
.blab span{flex:1;text-align:center;font-size:8.5px;color:var(--faint)}

.note{margin-top:10px;padding:15px 16px;background:#12161C;border:1px solid #1F252F;border-radius:11px;
      font-size:12.5px;color:#96A1B5;line-height:1.65}
.note b{color:#DCE3EE;font-weight:600}
.note ul{margin:8px 0 0 16px;display:grid;gap:6px}
.note code{font-family:'JetBrains Mono',monospace;font-size:11px;background:#1B222C;color:#B9C6DA;padding:1.5px 5px;border-radius:4px}
.mspec{display:grid;gap:10px;margin-top:10px}
.mrow{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:10px 12px;background:#161B23;border:1px solid #232A35;border-radius:9px}
.mrow .mk{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#7E8CA3;line-height:1.5}
.mrow .mv{font-size:12.5px;color:#AEBACE;line-height:1.6}
.mrow .mv b{color:#E4EAF3}
.mrow .mv em{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:11px;color:#8FB4E8}
pre{background:#0E1218;border:1px solid #1E252F;border-radius:9px;padding:13px;overflow-x:auto;margin-top:10px}
pre code{background:none;padding:0;font-size:11px;line-height:1.65;color:#B5C2D6;display:block}
/* board shell — multiple small surfaces on one themed canvas */
.board{background:var(--bg);color:var(--ink);font-family:var(--f-ui);padding:20px;display:grid;gap:14px;
  border-radius:13px;height:auto;overflow:visible}
.board *{font-variant-numeric:tabular-nums}
/* any icon not already sized by a component rule */
.icobox{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.icobox svg{width:100%;height:100%;display:block}
.board.g2{grid-template-columns:1fr 1fr}
.board.g3{grid-template-columns:repeat(3,1fr)}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.mini .mh{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.mini .mh b{font-size:11.5px;font-weight:600;color:var(--ink)}
.mini .mh span{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--faint);letter-spacing:.08em;
  text-align:right;line-height:1.4;flex:0 0 auto;max-width:52%}
.mini .mb{padding:16px 14px}
.empt{text-align:center;padding:6px 4px}
.empt .art{margin:0 auto 13px;width:104px}
.empt .t{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.4}
.empt .s{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.55}
.empt .acts{display:flex;gap:7px;margin-top:14px}
.empt .acts .btn{flex:1;padding:9px 10px;font-size:12px;white-space:nowrap}
.mini .btn{white-space:nowrap}
/* banner inside a mini */
.bnr{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid}
.bnr .bt{font-size:11.5px;line-height:1.45;flex:1}

/* skeletons */
.sk{background:var(--track);border-radius:5px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:shim 1.4s infinite}
@keyframes shim{100%{transform:translateX(100%)}}
.skrow{display:flex;gap:10px;padding:12px 13px;border-bottom:1px solid var(--line)}

/* voice orb */
/* Ripples are absolutely positioned, so the stage must reserve their envelope
   explicitly or following content slides under them.
   envelope = (orb + 2*outerInset) * maxScale  →  sm: (64+56)*1.14 ≈ 137, lg: (92+56)*1.14 ≈ 169 */
.orbstage{position:relative;display:grid;place-items:center;margin:0 auto}
.orbstage.sm{height:142px}
.orbstage.lg{height:176px}
.orbwrap{text-align:center;padding:4px 0}
.orb2{width:92px;height:92px;border-radius:50%;background:var(--brand);display:grid;place-items:center;margin:0 auto;position:relative}
.orb2 svg{width:34px;height:34px;color:var(--surface)}
.orb2::before,.orb2::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1.5px solid var(--brand);opacity:.28;animation:rip 2.6s ease-out infinite}
.orb2::after{inset:-28px;animation-delay:1.3s}
@keyframes rip{0%{transform:scale(.86);opacity:.4}100%{transform:scale(1.14);opacity:0}}
.wv{display:flex;align-items:center;justify-content:center;gap:3px;height:38px;margin-top:16px}
.wv i{width:3.5px;border-radius:2px;background:var(--brand);display:block;animation:wvb 1s ease-in-out infinite}
@keyframes wvb{0%,100%{transform:scaleY(.32)}50%{transform:scaleY(1)}}
.tx{font-size:13px;line-height:1.6;text-align:left}
.tx u{text-decoration:none;color:var(--faint)}

/* citizen desktop shell */
.dtop{background:var(--surface);border-bottom:1px solid var(--line);padding:0 22px;display:flex;align-items:center;gap:22px;height:56px;flex:0 0 auto}
.dtop .lg{font-size:17px}
.dtop nav{display:flex;gap:3px;margin-left:8px}
.dtop nav a{font-size:12.5px;font-weight:500;color:var(--muted);text-decoration:none;padding:7px 11px;border-radius:var(--r-sm)}
.dtop nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.dbody{flex:1;overflow:hidden;padding:18px 22px;display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-content:start}

/* RTL */
[dir="rtl"] .jrn{padding-left:0;padding-right:30px}
[dir="rtl"] .jrn::before,[dir="rtl"] .jrn .fill{left:auto;right:9px}
[dir="rtl"] .jn .d{left:auto;right:-30px}
[dir="rtl"] .row .rt,[dir="rtl"] .tcap{text-align:left}
[dir="rtl"] .urdu{font-family:'Noto Nastaliq Urdu',serif;line-height:2.1}
.ltrnum{direction:ltr;unicode-bidi:embed;display:inline-block}

/* ============ AMBIENT MOTION ============
   Slow and deliberately low-frame-rate. Stepped easing rather than smooth
   interpolation, so it reads as a living illustration rather than a video
   loop, and costs almost nothing to composite. */
@keyframes amSun{0%{transform:translateY(7px) scale(.985)}100%{transform:translateY(-5px) scale(1.015)}}
@keyframes amRays{to{transform:rotate(360deg)}}
@keyframes amFlame{0%,100%{transform:scaleY(.86) scaleX(1.04);opacity:.8}50%{transform:scaleY(1.16) scaleX(.95);opacity:1}}
@keyframes amShimmer{0%,100%{opacity:.18;transform:translateX(0)}50%{opacity:.72;transform:translateX(5px)}}
@keyframes amTwinkle{0%,100%{opacity:.16}50%{opacity:.95}}
@keyframes amGlint{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes amBreathe{0%,100%{opacity:.14}50%{opacity:.28}}
@keyframes amMoon{0%{transform:translate(0,0)}100%{transform:translate(-13px,7px)}}
@keyframes amDrift{0%{transform:translateX(0)}100%{transform:translateX(-46px)}}
@keyframes amSway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes amPing{0%{transform:scale(.62);opacity:.6}100%{transform:scale(1.7);opacity:0}}
@keyframes amFlow{to{stroke-dashoffset:-64}}
@keyframes amBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes amCell{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes amGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes amSlide{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes amCrew{0%{transform:translate(0,0)}55%{transform:translate(0,-72px)}100%{transform:translate(42px,-72px)}}
@keyframes amPan{0%{transform:scale(1.06) translateX(0)}100%{transform:scale(1.06) translateX(-3%)}}

/* every animated SVG node needs its own box for transform-origin */
.an-sun,.an-rays,.an-flame,.an-glint,.an-moon,.an-sway,.an-ping,.an-crew,.an-bob
  {transform-box:fill-box;transform-origin:center}

.an-sun{animation:amSun 16s steps(16,end) infinite alternate}
.an-rays{animation:amRays 300s steps(75,end) infinite}
.an-flame{transform-origin:bottom;animation:amFlame 1.9s steps(4,end) infinite}
.an-shimmer{animation:amShimmer 5.5s steps(6,end) infinite}
.an-twinkle{animation:amTwinkle 6s steps(3,end) infinite}
.an-glint{animation:amGlint 5s steps(3,end) infinite}
.an-breathe{animation:amBreathe 22s steps(12,end) infinite alternate}
.an-moon{animation:amMoon 120s steps(40,end) infinite alternate}
.an-drift{animation:amDrift 70s steps(24,end) infinite alternate}
.an-sway{transform-origin:bottom;animation:amSway 9s steps(10,end) infinite alternate}
.an-ping{animation:amPing 3.4s steps(9,end) infinite}
.an-flow{stroke-dasharray:8 6;animation:amFlow 5s steps(12,end) infinite}
.an-bob{animation:amBob 4s steps(6,end) infinite alternate}
.an-crew{animation:amCrew 11s steps(22,end) infinite}

/* system graphics — entrance, not idle loops */
.trk i{transform-origin:left;animation:amSlide .85s var(--ease-out,cubic-bezier(.22,1,.36,1)) both}
.bars i{transform-origin:bottom;animation:amGrow .6s var(--ease-out,cubic-bezier(.22,1,.36,1)) both}
.bars i:nth-child(1){animation-delay:.00s}.bars i:nth-child(2){animation-delay:.04s}
.bars i:nth-child(3){animation-delay:.08s}.bars i:nth-child(4){animation-delay:.12s}
.bars i:nth-child(5){animation-delay:.16s}.bars i:nth-child(6){animation-delay:.20s}
.bars i:nth-child(7){animation-delay:.24s}.bars i:nth-child(8){animation-delay:.28s}
.bars i:nth-child(9){animation-delay:.32s}.bars i:nth-child(10){animation-delay:.36s}
.bars i:nth-child(11){animation-delay:.40s}.bars i:nth-child(12){animation-delay:.44s}
.bars i:nth-child(13){animation-delay:.48s}.bars i:nth-child(14){animation-delay:.52s}
.jn.live .d{animation:amBob 2.6s steps(5,end) infinite alternate}
.heat i.hot{animation:amCell 7s steps(5,end) infinite}
.loginbg{animation:amPan 60s steps(30,end) infinite alternate}

/* ===== ambient illustration motion — slow, stepped, lo-fi =====
   steps() is deliberate: it gives limited-animation cadence (8–14 fps)
   rather than smooth interpolation, so it reads as drawn, not rendered.
   Data marks are excluded on purpose — see .an- usage notes.          */
.an-sun,.an-rays,.an-moon,.an-flame,.an-glow,.an-rip,.an-tw,.an-jali,
.an-mist,.an-sway,.an-ping,.an-blink,.an-march,.an-crew,.an-float{
  transform-box:view-box;will-change:transform,opacity}

/* ===== ambient illustration motion =====

<script>
const R=(s=>()=>((s=Math.imul(s^s>>>15,1|s))>>>0)/4294967296)(1947);

/* ================= THEMES ================= */
const THEMES={
 dawn:{name:"Bharat Dawn",sub:"Ghat sunrise · warm",cs:["#FBF6EC","#B4541A","#A9862F","#2A211A"],
   hero:heroDawn,
   note:"<b>Bharat Dawn — refined.</b> Your existing light theme, de-kitsched. Marigold is demoted to a single action colour and temple-gold survives only as hairline rules and reputation emblems, never as a fill. Fraunces at 500 for display, Inter for everything functional. Warmth comes from the paper substrate, not from gilding the controls."},
 mughal:{name:"Mughal Indigo",sub:"Jali night · brass",cs:["#0D1226","#C9A24A","#6FA8E8","#E7EAF5"],
   hero:heroMughal,
   note:"<b>Mughal Indigo.</b> The heritage reads as geometry, not ornament: an eight-point <i>jali</i> tessellation generated from a rosette rule, used as structural texture behind the hero and nowhere else. Antique brass is the only warm note and appears at roughly 4% of surface area. Night-shift legible without going to pure black."},
 steel:{name:"Civic Steel",sub:"Neutral · dense",cs:["#F5F6F8","#1F5FD0","#0D1117","#B45309"],
   hero:heroSteel,
   note:"<b>Civic Steel.</b> Your <code>samadhan-pro</code> palette taken all the way across every surface, including citizen-facing. 8px radii, tighter type, higher density. This is the direction to pick if the app will be judged mainly on the officer and admin consoles, where people sit for eight hours."},
 nilgiri:{name:"Nilgiri Mist",sub:"Cool · calm",cs:["#EFF2F0","#136F63","#7C7233","#16211E"],
   hero:heroNilgiri,
   note:"<b>Nilgiri Mist.</b> The dormant palette, activated. Cool low-chroma greens and slate, 16–24px radii, generous air. It's the only one of the four that reads as calm rather than urgent — worth testing precisely because a grievance app is a stressful context and the competing directions all raise the temperature."}
};

/* ================= HERO ILLUSTRATIONS ================= */
function heroDawn(){
  const W=700,H=290;let o=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  o+=`<defs><linearGradient id="dsky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F4B357"/><stop offset=".45" stop-color="#E88B4B"/><stop offset="1" stop-color="#C4623A"/></linearGradient></defs>`;
  o+=`<rect width="${W}" height="${H}" fill="url(#dsky)"/>`;
  o+=`<g class="an-sun" style="transform-origin:470px 132px"><circle cx="470" cy="132" r="52" fill="#FFE7B0" fill-opacity=".92"/></g>`;
  o+=`<g class="an-rays" style="transform-origin:470px 132px">`;
  o+=`<g class="an-rays">`;
  for(let i=0;i<26;i++){const a=i*(Math.PI*2/26);o+=`<line x1="470" y1="132" x2="${(470+Math.cos(a)*300).toFixed(1)}" y2="${(132+Math.sin(a)*300).toFixed(1)}" stroke="#FFE7B0" stroke-opacity=".10" stroke-width="9"/>`;}
  o+=`</g>`;
  o+=`</g>`;
  // far temple skyline
  const sil=(y,col,op)=>{
    let d=`M0 ${H} L0 ${y+40} `;
    const tw=[[36,26],[92,44],[150,18],[196,52],[262,30],[318,60],[392,24],[440,46],[512,20],[566,50],[634,28],[680,42]];
    tw.forEach(([x,h])=>{d+=`L${x-16} ${y+40-h*.4} L${x-16} ${y+40-h} L${x} ${y+40-h-13} L${x+16} ${y+40-h} L${x+16} ${y+40-h*.4} `;});
    d+=`L${W} ${y+40} L${W} ${H} Z`;
    return `<path d="${d}" fill="${col}" fill-opacity="${op}"/>`;};
  o+=sil(112,"#8A3E22",.5);
  o+=sil(146,"#5E2716",.72);
  // ghat steps
  for(let s=0;s<7;s++){o+=`<rect x="${-20+s*8}" y="${208+s*12}" width="${W+40}" height="12" fill="#43200F" fill-opacity="${(.42+s*.07).toFixed(2)}"/>`;}
  // water + reflection
  o+=`<rect x="0" y="272" width="${W}" height="18" fill="#7A3A20" fill-opacity=".6"/>`;
  for(let i=0;i<34;i++){const x=R()*W,y=273+R()*15,w=8+R()*30;
    o+=`<rect class="an-rip" style="animation-delay:-${(R()*9).toFixed(2)}s;animation-duration:${(7+R()*6).toFixed(1)}s" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="1.6" rx=".8" fill="#FFD9A0" fill-opacity="${(.15+R()*.4).toFixed(2)}"/>`;}
  // diyas
  [[120,246],[300,258],[540,250],[640,262]].forEach(([x,y],k)=>{
    o+=`<ellipse cx="${x}" cy="${y}" rx="9" ry="3.4" fill="#2E1508" fill-opacity=".8"/>`;
    o+=`<path class="an-flame" style="transform-origin:${x}px ${y-3}px;animation-delay:-${(k*.43).toFixed(2)}s" d="M${x} ${y-11} q4 5 0 8 q-4-3 0-8" fill="#FFCF7A"/>`;
    o+=`<circle class="an-glow" style="animation-delay:-${(k*.61).toFixed(2)}s" cx="${x}" cy="${y-7}" r="10" fill="#FFCF7A" fill-opacity=".18"/>`;});
  return o+`</svg>`;
}
function heroMughal(){
  const W=700,H=290,g="#C9A24A";let o=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  o+=`<defs><linearGradient id="msky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#101736"/><stop offset="1" stop-color="#070B1B"/></linearGradient>
    <clipPath id="arch"><path d="M110 260 L110 120 Q110 46 202 46 Q294 46 294 120 L294 260 Z"/></clipPath></defs>`;
  o+=`<rect width="${W}" height="${H}" fill="url(#msky)"/>`;
  for(let i=0;i<90;i++){o+=`<circle class="an-tw" style="animation-delay:-${(R()*5).toFixed(2)}s;animation-duration:${(3.5+R()*5).toFixed(1)}s" cx="${(R()*W).toFixed(1)}" cy="${(R()*200).toFixed(1)}" r="${(R()*1.1+.3).toFixed(2)}" fill="#DCE3FF" fill-opacity="${(.2+R()*.6).toFixed(2)}"/>`;}
  o+=`<g class="an-moon"><circle cx="556" cy="86" r="34" fill="#E9EDFB" fill-opacity=".9"/><circle cx="544" cy="78" r="30" fill="#0C1128"/></g>`;
  // jali lattice — 8-point rosette tessellation
  let jal="";const u=34;
  for(let r=0;r<9;r++)for(let c=0;c<22;c++){
    const cx=c*u+(r%2?u/2:0), cy=r*u*.86+18, s=u*.46;
    let p="";for(let k=0;k<8;k++){const a=k*Math.PI/4, rad=k%2?s*.52:s;
      p+=`${(cx+Math.cos(a)*rad).toFixed(1)},${(cy+Math.sin(a)*rad).toFixed(1)} `;}
    jal+=`<polygon points="${p}" fill="none" stroke="${g}" stroke-width="1"/>`;
    jal+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(s*.2).toFixed(1)}" fill="${g}" fill-opacity=".5"/>`;}
  o+=`<g class="an-jali" opacity=".2">${jal}</g>`;
  // arch with denser jali inside
  o+=`<g clip-path="url(#arch)"><rect x="100" y="30" width="210" height="240" fill="#0A0F24"/><g opacity=".55">${jal}</g></g>`;
  o+=`<path d="M110 260 L110 120 Q110 46 202 46 Q294 46 294 120 L294 260" fill="none" stroke="${g}" stroke-width="2.4"/>`;
  o+=`<path d="M122 260 L122 124 Q122 58 202 58 Q282 58 282 124 L282 260" fill="none" stroke="${g}" stroke-width="1" stroke-opacity=".55"/>`;
  // chhatri domes
  [[430,180],[520,190],[610,176]].forEach(([x,y])=>{
    o+=`<path d="M${x-30} ${y} q30 -42 60 0 Z" fill="#151C3A" stroke="${g}" stroke-width="1.2" stroke-opacity=".7"/>`;
    o+=`<line x1="${x}" y1="${y-38}" x2="${x}" y2="${y-50}" stroke="${g}" stroke-width="1.6"/>`;
    o+=`<circle class="an-finial" style="animation-delay:-${(x%7)*0.6}s" cx="${x}" cy="${y-52}" r="3" fill="${g}" fill-opacity=".9"/>`;
    o+=`<rect x="${x-34}" y="${y}" width="68" height="80" fill="#111834" stroke="${g}" stroke-width="1" stroke-opacity=".45"/>`;});
  o+=`<rect x="0" y="258" width="${W}" height="32" fill="#0A0E20"/>`;
  o+=`<line x1="0" y1="258" x2="${W}" y2="258" stroke="${g}" stroke-width="1" stroke-opacity=".5"/>`;
  return o+`</svg>`;
}
function heroSteel(){
  const W=700,H=290,u=15,ox=352,oy=76,b="#1F5FD0";
  const P=(x,y,z)=>[ox+(x-y)*.866*u, oy+(x+y)*.5*u - z*u];
  const pt=a=>a.map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" ");
  let o=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  o+=`<rect width="${W}" height="${H}" fill="#EEF1F6"/>`;
  for(let i=0;i<=14;i++){const a=P(i,0,0),z=P(i,12,0);o+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${z[0].toFixed(1)}" y2="${z[1].toFixed(1)}" stroke="${b}" stroke-opacity=".13"/>`;}
  for(let j=0;j<=12;j++){const a=P(0,j,0),z=P(14,j,0);o+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${z[0].toFixed(1)}" y2="${z[1].toFixed(1)}" stroke="${b}" stroke-opacity=".13"/>`;}
  const B=[[1.4,1.4,3,2.6,2.4],[5.4,.8,3,2.2,3.6],[9.8,1.4,2.6,3,1.8],[1,7.4,2.8,3,3],[9,5.6,3.4,2.4,4.4],[5,8,2.6,2.6,2.2],[10.6,8.4,2.2,2.2,3.2]];
  B.sort((a,z)=>(a[0]+a[1])-(z[0]+z[1])).forEach(([x,y,w,d,h])=>{
    o+=`<polygon points="${pt([P(x,y+d,0),P(x,y+d,h),P(x+w,y+d,h),P(x+w,y+d,0)])}" fill="#D5DDEA" stroke="${b}" stroke-opacity=".4"/>`;
    o+=`<polygon points="${pt([P(x+w,y,0),P(x+w,y,h),P(x+w,y+d,h),P(x+w,y+d,0)])}" fill="#C4CFE0" stroke="${b}" stroke-opacity=".4"/>`;
    o+=`<polygon points="${pt([P(x,y,h),P(x+w,y,h),P(x+w,y+d,h),P(x,y+d,h)])}" fill="#E8EDF5" stroke="${b}" stroke-opacity=".55"/>`;});
  const rib=(p,c,w,op)=>`<polyline points="${p.map(q=>{const s=P(q[0],q[1],.05);return s[0].toFixed(1)+","+s[1].toFixed(1);}).join(" ")}" fill="none" stroke="${c}" stroke-width="${w}" stroke-opacity="${op}" stroke-linecap="round"/>`;
  o+=rib([[0,6],[14,6]],"#A9B6CA",11,1);
  o+=rib([[7,0],[7,12]],"#A9B6CA",11,1);
  o+=rib([[.5,6],[7,6],[7,11.5]],b,2.2,.9).replace('fill="none"','fill="none" class="an-flow" stroke-dasharray="7 7"');
  [[7,6,b,"OPEN 14"],[2.6,6,"#B45309","SLA 3"],[11,6,"#B42318","ESC 2"]].forEach(([x,y,c,t])=>{
    const g=P(x,y,.1),tp=P(x,y,2.1);
    o+=`<line x1="${g[0].toFixed(1)}" y1="${g[1].toFixed(1)}" x2="${tp[0].toFixed(1)}" y2="${tp[1].toFixed(1)}" stroke="${c}" stroke-width="1.2"/>`;
    o+=`<ellipse cx="${g[0].toFixed(1)}" cy="${g[1].toFixed(1)}" rx="10" ry="5.6" fill="none" stroke="${c}" stroke-width="1.2" stroke-opacity=".5"/>`;
    o+=`<ellipse class="an-ping" style="animation-delay:-${(x*.7).toFixed(2)}s" cx="${g[0].toFixed(1)}" cy="${g[1].toFixed(1)}" rx="16" ry="9" fill="none" stroke="${c}" stroke-width="1.4"/>`;
    o+=`<circle cx="${tp[0].toFixed(1)}" cy="${tp[1].toFixed(1)}" r="3.4" fill="${c}"/>`;
    o+=`<rect x="${(tp[0]-25).toFixed(1)}" y="${(tp[1]-22).toFixed(1)}" width="50" height="14" rx="3" fill="${c}"/>`;
    o+=`<text x="${tp[0].toFixed(1)}" y="${(tp[1]-12).toFixed(1)}" font-family="JetBrains Mono, monospace" font-size="8" fill="#fff" text-anchor="middle">${t}</text>`;});
  return o+`</svg>`;
}
function heroNilgiri(){
  const W=700,H=290;let o=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  o+=`<defs><linearGradient id="nsk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCE7E3"/><stop offset="1" stop-color="#F1F5F3"/></linearGradient></defs>`;
  o+=`<rect width="${W}" height="${H}" fill="url(#nsk)"/>`;
  o+=`<circle cx="182" cy="84" r="30" fill="#F6F2E2" fill-opacity=".9"/>`;
  const ridge=(base,amp,col,op,seed)=>{
    let d=`M0 ${H} L0 ${base}`;
    for(let x=0;x<=W;x+=20){const y=base - Math.sin((x+seed)/120)*amp - Math.sin((x+seed)/47)*amp*.4;d+=` L${x} ${y.toFixed(1)}`;}
    return `<path d="${d} L${W} ${H} Z" fill="${col}" fill-opacity="${op}"/>`;};
  o+=ridge(150,26,"#136F63",.16,0);
  o+=ridge(178,22,"#136F63",.24,220);
  o+=ridge(206,18,"#136F63",.36,480);
  // mist bands
  [[142,16,"an-mist",0],[176,12,"an-mist2",-18],[204,10,"an-mist",-44]].forEach(([y,h,cls,d])=>
    o+=`<rect class="${cls}" style="animation-delay:${d}s" x="-60" y="${y}" width="${W+120}" height="${h}" fill="#FFFFFF" fill-opacity=".42"/>`);
  // tea terrace contours
  o+=ridge(238,12,"#0F5B51",.5,760);
  for(let i=0;i<9;i++){let d=`M0 ${244+i*6}`;
    for(let x=0;x<=W;x+=24){const y=244+i*6 - Math.sin((x+760)/140)*(10-i)*.7;d+=` L${x} ${y.toFixed(1)}`;}
    o+=`<path d="${d}" fill="none" stroke="#EFF4F2" stroke-opacity=".3" stroke-width="1.2"/>`;}
  // scattered tea bushes
  for(let i=0;i<120;i++){const x=R()*W,y=246+R()*42;
    o+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(2+R()*2.4).toFixed(1)}" fill="#0B4A42" fill-opacity="${(.1+R()*.22).toFixed(2)}"/>`;}
  // eucalyptus
  [[598,236,52],[634,244,40],[560,242,44]].forEach(([x,y,h],i)=>{
    o+=`<g class="an-sway" style="animation-delay:-${(i*5.3).toFixed(1)}s;transform-origin:${x}px ${y}px">`;
    o+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y-h}" stroke="#123F39" stroke-opacity=".55" stroke-width="2"/>`;
    for(let k=0;k<5;k++)o+=`<ellipse cx="${x}" cy="${y-h+8+k*7}" rx="${13-k*1.6}" ry="5" fill="#134F46" fill-opacity=".4"/>`;
    o+=`</g>`;});
  return o+`</svg>`;
}


/* ---------- streak emblem: day-ring + duotone flame ----------
   Not an icon. The ring is 30 tapered day-segments; filled ones are the streak,
   so the graphic carries the datum instead of decorating it. */
function streakEmblem(days=18,target=30,size=64){
  const C=36,R1=27.5,R2=32.5;
  let seg="";
  for(let i=0;i<target;i++){
    const a=(i/target)*Math.PI*2 - Math.PI/2;
    const x1=C+Math.cos(a)*R1, y1=C+Math.sin(a)*R1;
    const x2=C+Math.cos(a)*R2, y2=C+Math.sin(a)*R2;
    const on=i<days;
    seg+=`<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}"
      stroke="${on?'var(--warn)':'var(--line-strong)'}" stroke-width="${on?2.6:1.8}"
      stroke-linecap="round" opacity="${on?1:.5}"/>`;
  }
  return `<svg viewBox="0 0 72 72" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
   <circle cx="36" cy="36" r="23" fill="var(--warn-bg)"/>
   ${seg}
   <g transform="translate(36 36) scale(.62) translate(-20 -21.5)">
    <path d="M20 2 C26 11 33 17 33 26 C33 34.3 27.2 41 20 41 C12.8 41 7 34.3 7 26
             C7 21.5 9.2 17.6 12 14.5 C12.4 19.5 14.2 22.4 16.4 23.6
             C15.6 16.4 16.8 8.4 20 2 Z"
          fill="var(--warn-bg)" stroke="var(--warn)" stroke-width="2.1" stroke-linejoin="round"/>
    <path d="M20 17.5 C23.3 22.2 26.3 25.7 26.3 30.2 C26.3 34.5 23.4 37.8 20 37.8
             C16.6 37.8 13.7 34.5 13.7 30.2 C13.7 27.7 15 25.4 16.7 23.6
             C16.9 26.5 17.9 28 19.1 28.6 C18.7 24.7 18.9 20.9 20 17.5 Z"
          fill="var(--warn)"/>
   </g></svg>`;
}

P.ward={role:"citizen",route:"/ward/[code]",name:"Ward heatmap",shell:"m",
 desc:"Density by 100 m cell, with the legend and the <b>denominator</b> always visible. A heatmap without n is decoration.",
 ux:["Sequential single-hue scale, not rainbow — rainbow scales are unreadable for the 8% of men with CVD.","Tapping a cell filters the list below it rather than opening a modal; the map and the list stay in one mental model.","Department breakdown uses one shared scale so four rows compare at a glance."],
 html:()=>{
  let cells="";const cen=[[4,3,2.6],[9,5,3.2],[13,3,2.1],[6,8,2.3]];
  const sc=["var(--track)","var(--brand-line)","var(--brand-soft)","var(--brand)","var(--dang)"];
  for(let r=0;r<10;r++)for(let c=0;c<16;c++){let v=0;
    cen.forEach(([cx,cy,rad])=>{v+=Math.max(0,1-Math.hypot(c-cx,(r-cy)*1.35)/rad);});
    v+=(R()-.5)*.18;const l=v<=.05?0:Math.min(4,Math.floor(v*4.6));
    cells+=`<i class="${l>=3?'an-heat':''}" style="background:${l===0?'var(--track)':sc[l]};opacity:${l===0?.45:1};animation-delay:-${((r*16+c)%11).toFixed(1)}s"></i>`;}
  return `${hdr("Ward K-East","24 wards · MCGM · July 2026",0)}
  <div class="body">
   <div class="card"><div class="ch"><b>Open complaints</b><span class="m">PER 100 m CELL · n=609</span></div><div class="cb">
     <div class="heat" style="grid-template-columns:repeat(16,1fr)">${cells}</div>
     <div class="legend"><span>Low</span><span class="sc">${sc.map(c=>`<i style="background:${c}"></i>`).join("")}</span><span>40+</span>
      <span style="margin-left:auto" class="mono">TAP A CELL TO FILTER</span></div></div></div>
   <div class="card"><div class="ch"><b>By department</b><span class="m">MEDIAN DAYS vs SLA</span></div>
    ${[["Power · BEST","1.4","2d",54,"ok"],["Sanitation","2.8","3d",73,"ok"],["Water & Sewage","8.1","7d",90,"warn"],["Roads","19.3","10d",100,"dang"]]
     .map(([n,v,l,p,s])=>`<div class="row"><div class="mn"><div class="t1">${n}</div>
      <div style="margin-top:7px"><div class="trk" style="height:5px"><i style="width:${p}%;background:var(--${s})"></i><u style="left:78%"></u></div></div></div>
      <div class="rt" style="width:64px"><div class="t1" style="color:var(--${s})">${v}</div><div class="t2">SLA ${l}</div></div></div>`).join("")}
   </div>
  </div>${tabbar("Feed")}`}};

P.tracker={role:"citizen",route:"/cases/[id] · variants",name:"Tracker · 3 variants",shell:"board3",
 desc:"The brief asks to reimagine the signature moment. Three readings of the same case, each winning in a different context.",
 ux:["<b>Stepper</b> wins where vertical space is scarce — case rows, officer tables, notification previews. It answers 'which stage' and nothing more.","<b>Map</b> wins when there is a physical crew and a physical site. This is the literal Uber reading, and it only earns its space once field-ping data exists — otherwise it's a fake.","<b>Timeline</b> wins on the case page itself, because it's the only variant that can show stage durations, the named officer, and the future escalation rung together."],
 html:()=>{
  const stepper=`<div class="mini"><div class="mh"><b>A · Compact stepper</b><span>ROWS, TABLES</span></div><div class="mb">
   <div class="stepper" style="margin-bottom:12px">${[["Filed","done"],["Ack","done"],["Assigned","done"],["Progress","on"],["Resolved",""],["Closed",""]]
     .map(([n,s],i)=>`<div class="s ${s}"><i>${s==="done"?"✓":i+1}</i><b>${n}</b></div>`).join("")}</div>
   ${sla(55,78,"warn","<b>Day 4</b> of 7","<b>3d 04h left</b>")}
   <div class="t2" style="font-size:10.5px;color:var(--muted);margin-top:11px;line-height:1.5">Fits one row. Reads at a glance. Carries no detail beyond stage and clock — which is exactly right in a list.</div>
  </div></div>`;
  let g="";for(let i=0;i<8;i++)g+=`<line x1="0" y1="${18+i*26}" x2="300" y2="${18+i*26}" stroke="var(--line-2)" stroke-width="1"/>`;
  for(let i=0;i<10;i++)g+=`<line x1="${14+i*32}" y1="0" x2="${14+i*32}" y2="210" stroke="var(--line-2)" stroke-width="1"/>`;
  const map=`<div class="mini"><div class="mh"><b>B · Map & crew</b><span>NEEDS FIELD PINGS</span></div>
   <svg viewBox="0 0 300 210" style="display:block;width:100%;background:var(--surface-2)">
    <g opacity=".55">${g}</g>
    <rect x="0" y="88" width="300" height="16" fill="var(--line-2)" opacity=".8"/>
    <rect x="140" y="0" width="14" height="210" fill="var(--line-2)" opacity=".8"/>
    <path class="an-flow" d="M62 168 L62 96 L147 96" fill="none" stroke="var(--brand)" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/>
    <circle cx="62" cy="168" r="7" fill="var(--brand)"/><circle cx="62" cy="168" r="14" fill="var(--brand)" opacity=".18"/>
    <text x="62" y="190" font-size="8.5" fill="var(--muted)" text-anchor="middle" font-family="JetBrains Mono, monospace">DEPOT</text>
    <path d="M147 96 m0 -20 a13 13 0 1 1 .1 0 Z" fill="var(--dang)"/><circle cx="147" cy="83" r="4.6" fill="var(--surface)"/>
    <text x="147" y="118" font-size="8.5" fill="var(--dang)" text-anchor="middle" font-family="JetBrains Mono, monospace">27TH RD</text>
    <g class="an-crew"><circle cx="90" cy="96" r="6" fill="var(--warn)"/>
     <circle class="an-ping" cx="90" cy="96" r="12" fill="none" stroke="var(--warn)" stroke-width="1.6"/></g>
    <rect x="70" y="58" width="70" height="17" rx="4" fill="var(--warn)"/>
    <text x="105" y="70" font-size="8.5" fill="#fff" text-anchor="middle" font-family="JetBrains Mono, monospace">CREW · 20 MIN</text>
   </svg>
   <div class="mb" style="padding-top:11px"><div class="t1" style="font-size:12px">Crew en route · arriving 11:40</div>
    <div class="t2" style="font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.5">Only honest once the field app emits pings. A simulated ETA on a civic tool destroys trust faster than no ETA at all.</div></div></div>`;
  const timeline=`<div class="mini"><div class="mh"><b>C · Live timeline</b><span>CASE PAGE · DEFAULT</span></div><div class="mb">
   <div class="jrn"><div class="fill" style="height:52%"></div>
    <div class="jn done"><div class="d">${ic("chk")}</div><div class="w">22 JUL<em>21 min</em></div><div class="h">Filed</div></div>
    <div class="jn done"><div class="d">${ic("chk")}</div><div class="w">23 JUL<em>2d 5h</em></div><div class="h">Assigned</div>
     <div class="who"><div class="av" style="width:24px;height:24px;font-size:9px">RM</div>
      <div><div class="t1" style="font-size:11px">R. Manjunath</div></div></div></div>
    <div class="jn live"><div class="d"></div><div class="w">25 JUL<em>3d 18h</em></div><div class="h">Inspected</div></div>
    <div class="jn next"><div class="d">${ic("up")}</div><div class="w" style="color:var(--dang)">31 JUL · AUTO</div><div class="h">Escalates</div></div>
   </div>
   <div class="t2" style="font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.5">The only variant that shows time <i>in</i> each stage, which is where delay actually hides.</div>
  </div></div>`;
  return stepper+map+timeline;}};

P.onboard={role:"citizen",route:"/onboarding",name:"Onboarding",shell:"board3",
 desc:"Three cards, one promise each. Onboarding earns its interruption only if it teaches something the UI can't say by itself.",
 ux:["Card 2 is the only one that matters — it sets the expectation that a clock exists and escalation is automatic. Without it, the SLA bar means nothing on first sight.","Language is chosen on card 1, before any prose the user might not read.","Skippable at every step, and the whole flow is re-openable from Profile. Onboarding you can't get back is onboarding people rush through."],
 html:()=>[["1","Speak, don't type","Describe the problem in any of 18 languages. We'll route it to the right department and keep your own words on the record.","mic"],
   ["2","A clock starts, and a name","Every category has a legal time limit. You'll see a named officer and the time remaining — and it escalates on its own if that time runs out.","clk"],
   ["3","You're not alone","Neighbours can co-sign your case. Co-signed cases close faster, and you can see how your whole ward is doing.","users"]]
  .map(([n,t,b,i])=>`<div class="mini"><div class="mh"><b>Step ${n} of 3</b><span>SKIP</span></div><div class="mb">
   <div style="text-align:center;padding:14px 0 6px"><div class="orb" style="width:56px;height:56px;box-shadow:0 0 0 8px var(--brand-soft)">${ic(i)}</div></div>
   <div class="t1" style="font-size:15px;text-align:center;margin-top:14px;font-weight:600">${t}</div>
   <div class="t2" style="font-size:11.5px;text-align:center;margin-top:7px;line-height:1.6;color:var(--muted)">${b}</div>
   ${n==="1"?`<div class="chips" style="justify-content:center;margin-top:13px">${["हिन्दी","English","मराठी","+15"].map((l,k)=>`<span class="chip ${k===1?'on':''}">${l}</span>`).join("")}</div>`:""}
   <div style="display:flex;gap:5px;justify-content:center;margin-top:16px">${[1,2,3].map(k=>

   <div class="btn p w" style="margin-top:13px">${n==="3"?"Get started":"Next"}</div>
  </div></div>`).join("")};

P.inbox={role:"officer",route:"/inbox",name:"Ranked inbox",shell:"d",
 desc:"Triage, not a list. Rank = <b>SLA risk × co-sign weight × severity</b>, so the row at the top is the one that costs most to ignore.",
 ux:["Status changes happen in-card. Opening a case to change one field is the single biggest time sink in this kind of tool.","The rank score is shown and decomposed on hover — an opaque priority number gets ignored by the people it's meant to help.","Bulk select supports assign and acknowledge only. Bulk resolve is deliberately absent; it's the main vector for gaming close rates."],
 html:()=>`<div class="staff">${sside("officer","Inbox")}<main class="smain">
  <div class="top"><div><h2 class="dis">Inbox</h2><div class="sub">63 open · 14 breaching within 48 h · sorted by risk</div></div>
    <div class="chips"><span class="chip on">All</span><span class="chip">Breaching 14</span><span class="chip">Unassigned 9</span><span class="chip">Awaiting info 6</span></div></div>
  <div class="grid4" style="margin-bottom:13px">
   ${[["Open","63","Across 8 categories",""],["Past SLA","9","+3 since Friday","dang"],["Closed this week","58","+11 vs last","ok"],["Close quality","78","%· AI-scored","warn"]]
    .map(([k,v,d,c])=>`<div class="card flat" style="margin:0"><div class="cb"><div class="k">${k}</div>
     <div class="v" style="font-size:24px;${c?`color:var(--${c})`:''}">${v}</div><div class="dd">${d}</div></div></div>`).join("")}</div>
  <div class="card" style="overflow:hidden"><table>
   <thead><tr><th style="width:5%">Rank</th><th style="width:27%">Case</th><th style="width:14%">Category</th>
    <th style="width:19%" class="r">Elapsed vs SLA</th><th style="width:11%">Weight</th><th style="width:12%">Status</th><th class="r" style="width:12%">Action</th></tr></thead>
   <tbody>
   ${[["1","Transformer sparking, 14th Cross","SMD-00889","Power · Safety","24 h",83,"dang","19h 48m","4h 12m left","38","dg","alert","Urgent"],
      ["2","Pothole near BDA park","SMD-00801","Roads","10 d",100,"dang","12d 11h","2d 11h over","21","dg","up","Escalated"],
      ["3","Sewage overflow, 27th Rd","SMD-00847","Water · Sewage","7 d",55,"warn","3d 20h","3d 04h left","14","wn","clk","Inspected"],
      ["4","Garbage pile, Nehru Market","SMD-00872","Sanitation","3 d",58,"warn","1d 18h","1d 06h left","38","nu","clk","Assigned"],
      ["5","Streetlight out, 14th Cross","SMD-00612","Power","4 d",38,"ok","1d 22h","2d early","3","ok","chk","Resolved"]]
    .map(([n,t,id,cat,sl,p,s,e,l,w,pk,pi,pl])=>`<tr>
     <td class="mono" style="color:var(--faint)">${n}</td>
     <td><div class="t1s">${t}</div><div class="idm">${id}</div></td>
     <td>${cat}<div class="t2s">SLA ${sl}</div></td>
     <td class="r"><div style="width:140px;margin-left:auto"><div class="trk" style="height:5px"><i style="width:${p}%;background:var(--${s})"></i><u style="left:78%"></u></div>
       <div class="tcap"><span>${e}</span><span><b style="color:var(--${s})">${l}</b></span></div></div></td>
     <td><span class="pill if">${ic("up")}${w}</span></td>
     <td><span class="pill ${pk}">${ic(pi)}${pl}</span></td>
     <td class="r"><span class="pill nu">Act ▾</span></td></tr>`).join("")}
   </tbody></table></div>
  </main></div>`};

const EASE={
 out:"cubic-bezier(.22,1,.36,1)", inOut:"cubic-bezier(.65,0,.35,1)",
 spring:"type:'spring', stiffness:420, damping:34"};

const MOTION_TOKENS=`<b>Motion tokens — put these in the theme layer, not in components.</b>
<div class="mspec">
 <div class="mrow"><div class="mk">--dur-instant<br>80 ms</div><div class="mv">Press feedback, checkbox, chip toggle. Below 80 ms reads as a glitch; above 120 ms reads as lag.</div></div>
 <div class="mrow"><div class="mk">--dur-fast<br>160 ms</div><div class="mv">Hover, focus ring, in-card status change, pill swap. <em>ease-out</em></div></div>
 <div class="mrow"><div class="mk">--dur-base<br>240 ms</div><div class="mv">Route transitions, accordion, sheet slide. <em>${EASE.out}</em></div></div>
 <div class="mrow"><div class="mk">--dur-slow<br>420 ms</div><div class="mv">Theme circular reveal, journey-rail fill, celebratory confirmations. <em>${EASE.inOut}</em></div></div>
 <div class="mrow"><div class="mk">--ease-out</div><div class="mv"><em>${EASE.out}</em> — the default. Fast start, soft landing. Everything entering the screen uses this.</div></div>
 <div class="mrow"><div class="mk">--ease-spring</div><div class="mv"><em>${EASE.spring}</em> — reserved for direct manipulation only: drag-to-escalate, sheet dismiss, pull-to-refresh.</div></div>
 <div class="mrow"><div class="mk">Reduced motion</div><div class="mv">Every entry below collapses to an opacity fade at <b>120 ms</b>. Never remove the transition entirely — an instant swap loses the causal link between tap and result.</div></div>
</div>`;

};

const BUILD=`<b>Handing this to Claude Code.</b> The whole system is portable as tokens plus a provider — no component rewrites required.
<div class="mspec">
 <div class="mrow"><div class="mk">Theme layer</div><div class="mv">Four <code>[data-theme]</code> blocks in <code>globals.css</code>. Keep your existing semantic names; add the missing <b>radius</b>, <b>shadow</b> and <b>display-font</b> tokens — they carry most of the character difference between Civic Steel and Nilgiri Mist.</div></div>
 <div class="mrow"><div class="mk">Theme picker</div><div class="mv">All four ship to the end user. Persist to <code>localStorage</code> + cookie so RSC renders the right theme on first paint and there is no flash. Apply on <code>&lt;html&gt;</code> via <code>data-theme</code>.</div></div>
 <div class="mrow"><div class="mk">Primitives first</div><div class="mv">Build <code>SlaBar</code>, <code>StatusPill</code>, <code>JourneyRail</code>, <code>MetricCard</code>, <code>DataTable</code> before any page. Every screen here is those five plus layout.</div></div>
 <div class="mrow"><div class="mk">The invariant</div><div class="mv"><code>SlaBar</code> must never render without its limit marker. Make <code>limitDays</code> a required prop so a duration can't be shown without its reference.</div></div>
 <div class="mrow"><div class="mk">Motion</div><div class="mv">One <code>&lt;PageTransition&gt;</code> wrapper in each shell's <code>template.tsx</code>. Shell components sit outside it so they never re-animate.</div></div>
</div>`;

/* ================= WIRING ================= */
const ORDER={Citizen:["home","dcitizen","file","voice","casedetail","tracker","cases","feed","ward","profile","leaderboard","notif"],
             Officer:["inbox","ocase","clusters","metrics","osettings"],
             Admin:["overview","officers","officerdetail","trends","policy"],
             Auth:["login","roleswitch","onboard"],
             "Cross-cutting":["empty","loading","errors","rtl"]};
let theme="dawn", page="home", tab="ux";

document.getElementById("tsw").innerHTML=Object.entries(THEMES).map(([k,v])=>
 `<button class="tbtn" data-t="${k}" aria-pressed="${k===theme}">
   <span class="cs">${v.cs.map(c=>`<i style="background:${c}"></i>`).join("")}</span>
   <span class="nm">${v.name}</span><span class="sb">${v.sub}</span></button>`).join("");

document.getElementById("rail").innerHTML=Object.entries(ORDER).map(([g,ids])=>
 `<div class="rl">${g}</div>`+ids.map(id=>
  `<button data-p="${id}" aria-current="${id===page}">${P[id].name}<span class="rn">${ids.indexOf(id)+1}</span></button>`).join("")).join("");

function render(){
  const p=P[page];
  document.getElementById("meta").innerHTML=
   `<div class="rt mono">${p.role.toUpperCase()} &nbsp;·&nbsp; ${p.route}</div>
    <h2>${p.name}</h2><p>${p.desc}</p>`;
  const inner=`<div class="app" data-theme="${theme}">${p.html(theme)}</div>`;
  const deck=document.getElementById("deck");
  if(p.shell==="m") deck.innerHTML=`<div class="phone">${inner}</div>`;
  else if(p.shell==="d") deck.innerHTML=`<div class="laptop"><div class="lchrome"><i></i><i></i><i></i><span class="u">samadhan.gov.in${p.route}</span></div>${inner}</div>`;
  else deck.innerHTML=`<div style="width:100%;max-width:1120px" data-theme="${theme}">
    <div class="board ${p.shell==="board2"?"g2":"g3"}">${p.html(theme)}</div></div>`;
  const m=MOTION[page]||MOTION._default;
  const panes={
   ux:`${THEMES[theme].note}<b style="display:block;margin-top:12px">UX decisions on this screen</b>
       <ul>${p.ux.map(u=>`<li>${u}</li>`).join("")}</ul>`,
   motion:`<b>User journey — ${m.j}</b>
       <div class="mspec">${m.s.map(([k,v,t])=>
         `<div class="mrow"><div class="mk">${k}</div><div class="mv">${v}<br>${t}</div></div>`).join("")}</div>
       <div style="margin-top:16px">${MOTION_TOKENS}</div>`,
   build:BUILD};
  document.getElementById("note").innerHTML=panes[tab];
  document.querySelectorAll(".itab").forEach(b=>b.setAttribute("aria-selected",b.dataset.i===tab));
  document.querySelectorAll("#rail button").forEach(b=>b.setAttribute("aria-current",b.dataset.p===page));
  document.querySelectorAll(".tbtn").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===theme));
}
document.getElementById("tsw").onclick=e=>{const b=e.target.closest(".tbtn");if(b){theme=b.dataset.t;render();}};
document.getElementById("rail").onclick=e=>{const b=e.target.closest("button");if(b){page=b.dataset.p;render();}};
document.getElementById("itabs").onclick=e=>{const b=e.target.closest(".itab");if(b){tab=b.dataset.i;render();}};
render();
</script>
